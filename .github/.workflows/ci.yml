name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: 安装依赖（按 uv.lock 精确还原）
        run: uv sync
      - name: 运行测试
        run: uv run pytest -v
